<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Telco Churn Intelligence Platform{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('index') }}" class="brand-logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">Telco<span class="accent">Churn</span> AI</span>
            </a>
            <nav class="nav-links">
                <a href="{{ url_for('index') }}" class="nav-link">Predictor</a>
                <a href="{{ url_for('metrics') }}" class="nav-link">Model Performance</a>
                <a href="{{ url_for('health') }}" target="_blank" class="nav-link badge-link">API Health</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2026 TelcoChurn AI &bull; End-to-End Machine Learning Platform with Python & Flask</p>
            <p class="footer-sub">Trained on IBM Telco Customer Churn Dataset &bull; Cross-Validated Classifiers</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
